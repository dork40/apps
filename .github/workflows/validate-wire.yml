name: Validate Wire catalog app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: add-wire-community-app
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install pyyaml
      - id: catalog
        continue-on-error: true
        run: python .github/scripts/ci.py --app wire --train community --test-file basic-values.yaml --render-only true
      - name: Show generated metadata changes
        if: always()
        run: git diff -- ix-dev/community/wire || true
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: generated-wire-catalog-app
          path: ix-dev/community/wire
      - name: Preserve validation result
        if: steps.catalog.outcome == 'failure'
        run: exit 1